services:
  postgres:
    image: postgres:16-alpine
    container_name: immigration-ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-immigration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ImmigrationDev}
      POSTGRES_DB: ${POSTGRES_DB:-ImmigrationDevDB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immigration} -d ${POSTGRES_DB:-ImmigrationDevDB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
